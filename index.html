<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차이나는형님 대행 계산기</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .tab-btn.active { background: #ffca28; }
        .input-group { margin-bottom: 15px; }
        .sub-tabs { display: flex; margin-bottom: 10px; cursor: pointer; }
        .sub-tab { flex: 1; text-align: center; padding: 8px; background: #ddd; border-radius: 4px; margin-right: 5px; font-size: 0.9em; }
        .sub-tab.active { background: #558b2f; color: white; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .result-box { background: #f0f0f0; padding: 15px; border-radius: 8px; font-size: 0.9em; border: 1px dashed #ccc; }
        .copy-btn { width: 100%; background: #558b2f; color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div style="text-align:center; font-weight:bold; margin-bottom:20px;">⚡ 차이나는형님 대행 계산기</div>
    <div class="tabs">
        <button id="pBtn" class="tab-btn active" onclick="changeMode('페이')">💰 페이대행</button>
        <button id="bBtn" class="tab-btn" onclick="changeMode('구매')">📦 구매대행</button>
    </div>

    <div class="sub-tabs">
        <div id="tabCNY" class="sub-tab active" onclick="changeInput('CNY')">중국돈(CNY) 계산</div>
        <div id="tabKRW" class="sub-tab" onclick="changeInput('KRW')">한국돈(KRW) 계산</div>
    </div>

    <input type="number" id="amt" placeholder="금액을 입력하세요" oninput="runCalc()">
    <div class="result-box" id="res">금액을 입력하면 결과가 나타납니다.</div>
    <button class="copy-btn" onclick="copyRes()">📋 신청서 양식 복사하기</button>
</div>

<script>
    const db = firebase.initializeApp({ databaseURL: "https://calc-f903b-default-rtdb.firebaseio.com/" }).database();
    let currentRate = 0, mode = '페이', inputType = 'CNY';

    db.ref('settings').on('value', (s) => {
        currentRate = s.val().rate;
        runCalc();
    });

    function changeMode(m) { mode = m; updateTabUI(); runCalc(); }
    function changeInput(t) { inputType = t; updateTabUI(); runCalc(); }

    function updateTabUI() {
        document.getElementById('pBtn').className = (mode === '페이' ? 'tab-btn active' : 'tab-btn');
        document.getElementById('bBtn').className = (mode === '구매' ? 'tab-btn active' : 'tab-btn');
        document.getElementById('tabCNY').className = (inputType === 'CNY' ? 'sub-tab active' : 'sub-tab');
        document.getElementById('tabKRW').className = (inputType === 'KRW' ? 'sub-tab active' : 'sub-tab');
        document.getElementById('amt').placeholder = (inputType === 'CNY' ? '신청할 중국돈(위안) 입력' : '보내실 한국돈(원) 입력');
    }

    function runCalc() {
        const val = parseFloat(document.getElementById('amt').value) || 0;
        let cny = 0, krw = 0, feeText = "";

        if (inputType === 'CNY') {
            cny = val;
            const feeRate = (mode === '페이' ? 0.03 : 0.05);
            const smallFee = (mode === '페이' ? 25 : 40);
            if (cny >= 800) {
                krw = Math.floor(cny * currentRate * (1 + feeRate));
                feeText = (mode === '페이' ? "수수료 3%" : "수수료 5%");
            } else {
                krw = Math.floor(cny * currentRate) + (smallFee * currentRate);
                feeText = `소액 수수료(${smallFee}위안)`;
            }
        } else {
            // 한국돈 입력 시: 중국돈으로 역산 (수수료 대략 계산)
            cny = Math.floor(val / (currentRate * (mode === '페이' ? 1.03 : 1.05)));
            krw = val;
            feeText = "한국돈 기준 계산";
        }

        document.getElementById('res').innerHTML = `[차이나는형님 ${mode}대행 신청서]<br>• 적용 환율: ${currentRate}원<br>• 수수료 정책: ${feeText}<br>• 중국 송금액: ${cny.toLocaleString()} 위안<br>• 최종 입금액: ${krw.toLocaleString()} 원<br>• 계좌: 1002-264-737229 우리은행 이성일`;
    }

    function copyRes() {
        navigator.clipboard.writeText(document.getElementById('res').innerText);
        alert("복사되었습니다!");
    }
</script>
</body>
</html>
