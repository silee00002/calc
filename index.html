<script>
    // ... (상단 설정 부분 동일)

    function runCalc() {
        const val = parseFloat(document.getElementById('amt').value) || 0;
        let cnyResult = 0, krw = 0, policy = ""; // cnyResult: 고객이 최종적으로 받는 위안화 합계
        
        const pRate = settings.pRate !== undefined ? settings.pRate : 3;
        const pFixed = settings.pFixed !== undefined ? settings.pFixed : 25;
        const bRate = settings.bRate !== undefined ? settings.bRate : 5;
        const bFixed = settings.bFixed !== undefined ? settings.bFixed : 40;

        const feeLabel = (pRate <= 2.5) ? "특별 우대 수수료" : "기본 대행 수수료";

        if (inputType === 'CNY') {
            const inputCNY = val;
            if (mode === '페이') {
                if (inputCNY >= 800) { 
                    cnyResult = inputCNY * (1 + pRate/100); // 수수료율만큼 합산
                    krw = Math.floor(inputCNY * settings.rate * (1 + pRate/100)); 
                    policy = `${feeLabel} (${pRate}%) 적용`; 
                } else { 
                    cnyResult = inputCNY + pFixed; // 고정 수수료 합산
                    krw = Math.floor(inputCNY * settings.rate) + (pFixed * settings.rate); 
                    policy = `800위안 미만 소액 고정 수수료 (${pFixed}위안) 적용`; 
                }
            } else {
                // 구매 대행 로직 동일 적용
                if (inputCNY >= 800) { 
                    cnyResult = inputCNY * (1 + bRate/100);
                    krw = Math.floor(inputCNY * settings.rate * (1 + bRate/100)); 
                    policy = `기본 대행 수수료 (${bRate}%) 적용`; 
                } else { 
                    cnyResult = inputCNY + bFixed;
                    krw = Math.floor(inputCNY * settings.rate) + (bFixed * settings.rate); 
                    policy = `800위안 미만 소액 고정 수수료 (${bFixed}위안) 적용`; 
                }
            }
        } else {
            // 원화 입력 시
            krw = val;
            const converted = val / settings.rate;
            if (mode === '페이') {
                if (converted >= 800) { 
                    cnyResult = converted * (1 - pRate/100); 
                    policy = `원화기준 ${feeLabel}(${pRate}%) 선차감 정산`; 
                } else { 
                    cnyResult = converted - pFixed; 
                    policy = `원화기준 소액 고정수수료(${pFixed}위안) 선차감 정산`; 
                }
            } else {
                if (converted >= 800) { 
                    cnyResult = converted * (1 - bRate/100); 
                    policy = `원화기준 수수료(${bRate}%) 선차감 정산`; 
                } else { 
                    cnyResult = converted - bFixed; 
                    policy = `원화기준 소액 고정수수료(${bFixed}위안) 선차감 정산`; 
                }
            }
        }

        document.getElementById('feeInfo').innerText = policy;
        // cnyResult를 소수점 없이 표기
        document.getElementById('res').innerHTML = `[차이나는형님 ${mode}대행 신청서]<br>--------------------------<br>• 신청 구분: ${inputType === 'CNY' ? '위안화' : '원화 맞춤 충전'} 신청<br>• 적용 환율: ${settings.rate} 원<br>• 수수료 정책: ${policy}<br>• 최종 송금액: ${Math.floor(cnyResult).toLocaleString()} 위안 (CNY)<br>• 입금 하실 금액: ${krw.toLocaleString()} 원 (KRW)<br>--------------------------<br>• 입금 계좌: ${settings.bank}<br>--------------------------<br>※ 입금 후 본 신청서를 대화방에 붙여넣어 주시면 5분 내 초고속 처리됩니다! ⚡`;
    }

    // ... (나머지 하단 코드 동일)
</script>
