<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차이나는형님 대행 계산기</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: 'Malgun Gothic', sans-serif; background: #f4f4f4; display: flex; justify-content: center; padding: 20px; }
        .card { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .title { text-align: center; font-size: 1.2em; font-weight: bold; margin-bottom: 20px; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #eee; cursor: pointer; font-weight: bold; border-radius: 5px; }
        .tab-btn.active { background: #ffca28; }
        .rate-box { background: #eee; padding: 12px; text-align: center; font-weight: bold; margin-bottom: 15px; border-radius: 5px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .result-box { background: #f0f0f0; padding: 15px; border-radius: 8px; font-size: 0.9em; color: #333; line-height: 1.6; border: 1px dashed #ccc; }
        .copy-btn { width: 100%; background: #558b2f; color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; margin-top: 15px; cursor: pointer; }
    </style>
</head>
<body>
<div class="card">
    <div class="title">⚡ 차이나는형님 대행 계산기</div>
    <div class="tabs">
        <button id="pBtn" class="tab-btn active" onclick="changeMode('페이')">💰 페이대행</button>
        <button id="bBtn" class="tab-btn" onclick="changeMode('구매')">📦 구매대행</button>
    </div>
    <div class="rate-box" id="rateText">환율 로딩 중...</div>
    <input type="number" id="amt" placeholder="신청할 중국돈 금액 (위안)" oninput="runCalc()">
    <div class="result-box" id="res">금액을 입력하면 신청서가 나타납니다.</div>
    <button class="copy-btn" onclick="copyRes()">📋 신청서 양식 복사하기</button>
</div>

<script>
    const db = firebase.initializeApp({ databaseURL: "https://calc-f903b-default-rtdb.firebaseio.com/" }).database();
    let currentRate = 0;
    let mode = '페이';

    db.ref('settings').on('value', (s) => {
        currentRate = s.val().rate;
        document.getElementById('rateText').innerText = "오늘의 실시간 환율: " + currentRate + " 원";
        runCalc();
    });

    function changeMode(m) {
        mode = m;
        document.getElementById('pBtn').className = (mode === '페이' ? 'tab-btn active' : 'tab-btn');
        document.getElementById('bBtn').className = (mode === '구매' ? 'tab-btn active' : 'tab-btn');
        runCalc();
    }

    function runCalc() {
        const cny = parseFloat(document.getElementById('amt').value) || 0;
        let feeText = "", finalPrice = 0;

        if (mode === '페이') {
            if (cny >= 800) {
                finalPrice = Math.floor(cny * currentRate * 1.03);
                feeText = "수수료 3% 적용";
            } else {
                finalPrice = Math.floor(cny * currentRate) + (25 * currentRate);
                feeText = "소액 수수료(25위안) 적용";
            }
        } else {
            // 구매대행: 800위안 이상 5%, 미만 40위안
            if (cny >= 800) {
                finalPrice = Math.floor(cny * currentRate * 1.05);
                feeText = "수수료 5% 적용";
            } else {
                finalPrice = Math.floor(cny * currentRate) + (40 * currentRate);
                feeText = "소액 수수료(40위안) 적용";
            }
        }

        document.getElementById('res').innerHTML = `[차이나는형님 ${mode}대행 신청서]<br>--------------------------<br>• 적용 환율: ${currentRate} 원<br>• 수수료 정책: ${feeText}<br>• 중국 송금액: ${cny.toLocaleString()} 위안 (CNY)<br>• 최종 입금액: ${finalPrice.toLocaleString()} 원 (KRW)<br>--------------------------<br>• 입금 계좌: 1002-264-737229 우리은행 이성일<br>--------------------------<br>※ 입금 후 본 신청서를 대화방에 붙여넣어 주시면 5분 내 초고속 처리됩니다! ⚡`;
    }

    function copyRes() {
        navigator.clipboard.writeText(document.getElementById('res').innerText);
        alert("신청서가 복사되었습니다!");
    }
</script>
</body>
</html>
