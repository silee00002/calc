<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>차이나는형님 계산기</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 400px; margin: auto; }
        .input-box { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; box-sizing: border-box; }
        .result-box { background: #f9f9f9; padding: 15px; border: 1px dashed #999; margin-top: 10px; white-space: pre-line; }
    </style>
</head>
<body>
    <h3>⚡ 차이나는형님 대행 계산기</h3>
    <div id="rateText">환율 로딩 중...</div>
    <input type="number" id="cny" class="input-box" placeholder="위안(CNY) 입력" oninput="calc()">
    <div id="res" class="result-box">금액을 입력하면 신청서가 나타납니다.</div>
    <button onclick="copy()" style="width:100%; padding:15px; margin-top:10px;">📋 신청서 복사하기</button>

    <script>
        const db = firebase.initializeApp({ databaseURL: "https://calc-f903b-default-rtdb.firebaseio.com/" }).database();
        let settings = { rate: 0, fee1: 3, fee2: 5 };
        
        db.ref('settings').on('value', (s) => {
            settings = s.val();
            document.getElementById('rateText').innerText = "현재 환율: " + settings.rate + "원";
            calc();
        });

        function calc() {
            const cny = document.getElementById('cny').value;
            const total = Math.floor(cny * settings.rate * (1 + settings.fee1/100)); // 페이 기준
            document.getElementById('res').innerText = `[신청서]\n환율: ${settings.rate}\n입금액: ${total.toLocaleString()}원`;
        }
        function copy() { navigator.clipboard.writeText(document.getElementById('res').innerText); alert("복사 완료!"); }
    </script>
</body>
</html>
